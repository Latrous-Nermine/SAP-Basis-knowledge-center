<svg xmlns="http://www.w3.org/2000/svg" width="240" height="160" viewBox="0 0 240 160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7566EE"/>
      <stop offset="1" stop-color="#4B3BB5"/>
    </linearGradient>
  </defs>
  <rect width="240" height="160" fill="url(#bg)"/>
  <circle cx="212" cy="140" r="40" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5"/>
  <!-- three overlapping "tile" screens -->
  <g>
    <rect x="46" y="70" width="70" height="56" rx="8" fill="#ffffff" fill-opacity="0.35" transform="rotate(-8 81 98)"/>
    <rect x="150" y="66" width="60" height="50" rx="8" fill="#ffffff" fill-opacity="0.45" transform="rotate(9 180 91)"/>
    <rect x="90" y="52" width="76" height="60" rx="9" fill="#ffffff"/>
  </g>
  <!-- simple content lines on the front tile -->
  <g fill="#4B3BB5" fill-opacity="0.55">
    <rect x="102" y="66" width="34" height="7" rx="3.5"/>
    <rect x="102" y="80" width="52" height="5" rx="2.5"/>
    <rect x="102" y="90" width="40" height="5" rx="2.5"/>
  </g>
  <circle cx="150" cy="66" r="6" fill="#4B3BB5" fill-opacity="0.4"/>
</svg>
