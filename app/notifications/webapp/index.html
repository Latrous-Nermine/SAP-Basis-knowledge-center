<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AYMAX Knowledge Hub — Notifications</title>
    <style>
      html, body { height: 100%; margin: 0; padding: 0; }
      /* Targeting [data-sap-ui-component] never matches at runtime -
         UI5's ComponentSupport strips that attribute once it processes
         the div and assigns its own auto-generated id instead, so this
         rule silently matched nothing. Fixing that alone isn't enough
         either: CSS percentage heights need an explicit (non-auto) height
         at EVERY ancestor level, and UI5 inserts its own unstyled wrapper
         divs (.sapUiComponentContainer and its child) below this point,
         breaking the chain for anything relying on inheriting a real
         height. */
      #content, #content > div { height: 100%; }
      .sapUiComponentContainer, .sapUiComponentContainer > div { height: 100%; }
    </style>
    <script id="sap-ui-bootstrap"
        src="https://sapui5.hana.ondemand.com/1.120.0/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resourceroots='{"aymax.notifications": "./"}'
        data-sap-ui-compatVersion="edge"
        data-sap-ui-async="true"
        data-sap-ui-frameOptions="trusted"
        data-sap-ui-oninit="module:sap/ui/core/ComponentSupport">
    </script>
</head>
<body class="sapUiBody" id="content">
    <div data-sap-ui-component
         data-name="aymax.notifications"
         data-id="container"
         data-settings='{"id" : "notifications"}'>
    </div>
</body>
</html>
